[package]
name = "c2pa-sign-sample"
version = "0.1.0"
edition = "2024"
default-run = "c2pa-sign-sample"

[dependencies]
c2pa-assertions = { version = "0.0.0", path = "../c2pa-assertions" }
c2pa-claim = { version = "0.0.0", path = "../c2pa-claim" }
c2pa-store = { version = "0.0.0", path = "../c2pa-store", features = ["write", "std"] }
c2pa_cbor = { git = "https://github.com/contentauth/c2pa-cbor", branch = "gpeacock/cose-support", features = ["cose"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
rcgen = { version = "0.14.10", default-features = false, features = ["pem"] }
time = { version = "0.3", features = ["std"] }
asset-io = { path = "../../asset-io", features = ["all-formats", "brotli"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
x509-parser = "0.18"
